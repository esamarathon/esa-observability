receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 8192
    timeout: 5s

exporters:
  otlphttp/vm-metrics:
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
    compression: gzip
  otlphttp/vm-logs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    compression: gzip
  otlphttp/vm-traces:
    traces_endpoint: http://victoriatraces:10428/insert/opentelemetry/v1/traces
    compression: gzip

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/vm-traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/vm-metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/vm-logs]
